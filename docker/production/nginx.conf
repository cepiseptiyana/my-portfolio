events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        location = /my-portfolio {
            return 301 /my-portfolio/;
        }

        location /my-portfolio/ {
            index index.html;
            try_files $uri $uri/ /my-portfolio/index.html;
            add_header Cache-Control "no-cache";
        }

        location ~* ^/my-portfolio/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}